<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Keep the CMS out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Manager</title>

    <!--
      Point Decap at an ABSOLUTE config path.

      Without this, Decap fetches "config.yml" relative to the page URL. This
      page is reachable at /admin (a rewrite onto /admin/index.html, so the URL
      has no trailing slash), and a relative "config.yml" from /admin resolves
      to /config.yml at the site root -- which 404s, and the CMS reports
      "Failed to load config.yml (404)".
    -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!--
      Hold the CMS back from starting itself, so the backend's base_url can be
      filled in from the browser before it boots.
    -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      /*
        The OAuth endpoints live in this same site (app/api/auth and
        app/api/callback), so base_url is simply wherever this page is served
        from. Setting it at runtime rather than writing it into config.yml means
        the same commit works on localhost, on Vercel preview deployments and on
        the production domain, with no value to keep in sync.

        CMS.init merges this over config.yml; conflicting keys win here.
      */
      window.CMS.init({
        config: {
          backend: {
            base_url: window.location.origin,
            auth_endpoint: "api/auth",
          },
        },
      });
    </script>
  </body>
</html>
