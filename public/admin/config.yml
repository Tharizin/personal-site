backend:
  name: github
  # Must match the GitHub repository exactly. A wrong value lets the CMS load
  # but every collection reads as empty, with no obvious error.
  #
  # This repo is PRIVATE, which Decap supports -- but it means the GitHub OAuth
  # app behind base_url has to request the full `repo` scope. An app scoped only
  # to `public_repo` will sign you in and then fail to read or write anything.
  repo: Tharizin/personal-site
  branch: main
  base_url: https://decap-oauth-proxy-pearl.vercel.app

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "gallery"
    label: "Gallery"
    folder: "content/gallery"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Caption", name: "caption", widget: "text", required: false }
  - name: "reading_recs"
    label: "Reading Recs"
    folder: "content/reading-recs"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Link", name: "link", widget: "string", required: false }
      - { label: "Your Take", name: "take", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
