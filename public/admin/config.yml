backend:
  name: github
  # Must match the GitHub repository exactly. Your account is `Tharizin` (capital
  # T) and your other repos are Title-Cased -- Stanford-Fruit-Map, Phylo -- so
  # this assumes the same style. If the repo is named anything else, change it
  # here too: a wrong value lets the CMS load but every collection comes back
  # empty, with no obvious error.
  repo: Tharizin/Personal-Site
  branch: main
  base_url: https://decap-oauth-proxy-pearl.vercel.app

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "gallery"
    label: "Gallery"
    folder: "content/gallery"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Caption", name: "caption", widget: "text", required: false }
  - name: "reading_recs"
    label: "Reading Recs"
    folder: "content/reading-recs"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Link", name: "link", widget: "string", required: false }
      - { label: "Your Take", name: "take", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
